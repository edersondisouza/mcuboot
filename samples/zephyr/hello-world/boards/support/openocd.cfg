# script for Nuvoton NPCX Cortex-M4 Series

source [find interface/jlink.cfg]
transport select swd

set FIUNAME npcx_v2.fiu
source [find target/npcx.cfg]

proc npcx_write_image {target_image target_address} {
    flash write_image erase $target_image $target_address bin
}

proc npcx_verify_image {target_image target_address}  {
    verify_image $target_image $target_address bin
}
